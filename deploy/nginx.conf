# Serves the static build. Three rules carry the weight:
#
#   - Every path that is not a file returns index.html, because the app's router owns
#     it. Without this a reload on /simulator, or a shared link to a lesson, is a 404.
#   - Hashed assets are cached for a year. Their file names change whenever their
#     content does, so a long cache can never serve a stale one.
#   - index.html is never cached. It is what points at the current hashed assets, so a
#     cached copy would keep serving the previous deploy until the cache gave up.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # add_header in a location replaces the server's, so each block repeats its own.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        # A missing asset is a 404, never index.html: HTML served as JavaScript fails
        # in a way that is much harder to recognise than a plain 404.
        try_files $uri =404;
    }

    # Self-hosted fonts. Their names carry the package version (tools/copy-fonts.mjs), so an
    # upgrade arrives under a new name and a year-long cache can never serve an old face.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri $uri/ /index.html;
    }
}
