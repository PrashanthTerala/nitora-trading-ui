name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Typecheck, content lint, the price check against the generator, and the engine
      # and figure tests. The image build only compiles and bundles, so this is the one
      # place the course's own correctness checks run before anything ships.
      - run: npm run check

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the repository name; GHCR rejects uppercase.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      # Never VITE_DATA_API: without it this is the public build, synthetic market only, no
      # request to any market-data service. See Dockerfile. SITE_URL is only the site's own
      # address, for sitemap.xml; while the repository variable is unset, no sitemap is written.
      # On a pull request this builds without pushing, so a broken Dockerfile fails the
      # PR rather than master.
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      # Checked out for deploy/docker-compose.yml, the only server-side configuration
      # this site has.
      - uses: actions/checkout@v4

      - name: Ship the compose file, pull the new image and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/id_ed25519 <<< "$KEY"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # The compose file travels with every deploy instead of the server keeping a
          # git checkout. It is the only thing the server needs from this repository, and
          # a checkout of a private repository would need its own credential on the box.
          ssh -o StrictHostKeyChecking=yes "$USER@$HOST" mkdir -p nitora-trading-ui
          scp -o StrictHostKeyChecking=yes deploy/docker-compose.yml "$USER@$HOST:nitora-trading-ui/docker-compose.yml"

          # A quoted heredoc, not a single-quoted string: nitorastone-ui lost a day of
          # deploys to an apostrophe in a comment ending a single-quoted payload early.
          # With <<'REMOTE' nothing below is expanded by the runner's shell.
          ssh -o StrictHostKeyChecking=yes "$USER@$HOST" bash -s <<'REMOTE'
            set -e
            cd ~/nitora-trading-ui
            docker compose pull web
            docker compose up -d
            docker image prune -f

            # Read the port without sourcing .env, which is optional and may not exist.
            PORT=$(sed -n "s/^TRADING_PORT=//p" .env 2>/dev/null | head -1)
            URL="http://127.0.0.1:${PORT:-8090}"
            for i in $(seq 1 30); do
              curl -fsS -o /dev/null "$URL/" && break
              sleep 2
            done

            # A deep link must come back as the app. The router owns every path, so a 404
            # here means nginx lost its fallback and every shared lesson link is broken.
            curl -fsS "$URL/simulator" | grep -q "Nitora Trading Academy"
            echo "deep link served by the app"

            # The public build must never reach for the market-data service: what it
            # fetches may not be shown to third parties. Counted rather than tested with
            # grep -q, and only after confirming the site is where the count looks, so a
            # check that fails to run aborts the deploy instead of reading as a pass.
            FOUND=$(docker exec nitora-trading-ui sh -c 'test -f /usr/share/nginx/html/index.html && grep -rl "localhost:5300" /usr/share/nginx/html | wc -l')
            if [ "$FOUND" != "0" ]; then
              echo "public image references localhost:5300 in $FOUND file(s)"
              exit 1
            fi
            echo "no data-service address in the public bundle"
          REMOTE
