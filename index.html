<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nitora Trading Academy: learn trading from zero, one small step at a time, then practise risk-free in a realistic paper-trading simulator." />
    <title>Nitora Trading Academy — Learn Trading From Zero</title>
    <!-- Link previews for crawlers that run no JavaScript. The image is made absolute at build
         time when SITE_URL is set (seoFiles in vite.config.ts); pages refine all of these. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nitora Trading Academy" />
    <meta property="og:title" content="Nitora Trading Academy — Learn Trading From Zero" />
    <meta property="og:description" content="Learn trading from zero, one small step at a time, then practise risk-free in a realistic paper-trading simulator." />
    <meta property="og:image" content="/art/og/default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Fonts are self-hosted (public/fonts, see tools/copy-fonts.mjs): no request leaves for a
         third party. The body face is preloaded because every page needs it before first paint. -->
    <link rel="preload" href="/fonts/inter-latin-wght-normal-v5.3.0.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
